# Tests the kit's own scripts and hooks. Projects may delete this file once copied.
name: kit-selftest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kit-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test 'scripts/test/*.test.mjs' '.claude/hooks/test/*.test.mjs'
      - run: node scripts/check-docs.mjs .
      - run: node scripts/check-context.mjs
      - run: node scripts/check-workflows.mjs
